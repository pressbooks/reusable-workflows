name: Run Tests 🧪

on:
  workflow_call:
    inputs:
      use_mariadb:
        description: "Use Maria DB"
        type: boolean
        required: false
        default: false
      requires_pressbooks:
        description: "Require Pressbooks (equivalent to hosts: '[\"pressbooks\"]')"
        type: boolean
        required: false
        default: false
      hosts:
        description: "JSON array of host plugin repos to run the suite against, e.g. '[\"pressbooks\", \"pressbooks-microcredentials\"]'. One job per host; PB_TEST_HOST is exported to the tests. Takes precedence over requires_pressbooks."
        type: string
        required: false
        default: "[]"
      requires_private_repo:
        description: "Require private repo"
        type: string
        required: false
        default: ""
      code_coverage:
        description: "Code coverage"
        type: boolean
        required: false
        default: true

jobs:
  tests:
    runs-on: ubuntu-24.04

    services:
      database:
        image: ${{ (inputs.use_mariadb) && 'mariadb:10.5' || 'mysql:8.0' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        # `hosts` wins when provided; `requires_pressbooks: true` maps to '["pressbooks"]';
        # otherwise a single empty-string host means "no host plugin".
        host: ${{ fromJSON(inputs.hosts != '[]' && inputs.hosts || (inputs.requires_pressbooks == true && '["pressbooks"]' || '[""]')) }}
        # PHP/WP combos live in one axis of objects (not `include`) so they cross
        # cleanly with the `host` axis.
        config:
          - php: "8.3"
            wordpress: "7.1.2"
            experimental: false
          - php: "8.3"
            wordpress: "latest"
            experimental: true
          - php: "8.4"
            wordpress: "7.1.2"
            experimental: true

    name: PHP ${{ matrix.config.php }} - WP ${{ matrix.config.wordpress }}${{ matrix.host != '' && format(' - {0}', matrix.host) || '' }} - ${{ (inputs.use_mariadb) && 'MariaDB' || 'MySQL' }}
    continue-on-error: ${{ matrix.config.experimental == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Install OS dependencies
        run: |
          sudo apt update
          sudo apt-get install libxml2-utils ghostscript poppler-utils imagemagick subversion
          sudo apt-get install -y libavif16 libgif7

      - name: Setup PHP and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.config.php }}
          tools: composer
          coverage: pcov
          extensions: imagick

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-composer-${{ matrix.config.php }}-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.config.php }}-
            ${{ runner.os }}-composer-

      - name: Cache WordPress test suite
        uses: actions/cache@v5
        with:
          path: /tmp/wordpress-tests-lib
          key: ${{ runner.os }}-wordpress-${{ matrix.config.wordpress }}-${{ hashFiles('bin/install-wp-tests.sh') }}

      - name: Install PHP dependencies
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_GITHUB_ACTIONS }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            export COMPOSER_AUTH="{\"github-oauth\": {\"github.com\": \"$GH_TOKEN\"}}"
          fi
          export PATH="$HOME/.composer/vendor/bin:$PATH"
          composer install --no-interaction --prefer-dist
          echo "REPO_NAME=$(basename $(pwd))" >> $GITHUB_ENV

      - name: Check Standards
        run: composer standards

      - name: Install host plugin
        if: matrix.host != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_GITHUB_ACTIONS }}
        run: |
          HOST="${{ matrix.host }}"
          if [ -n "$GH_TOKEN" ]; then
            CLONE_URL="https://x-access-token:${GH_TOKEN}@github.com/pressbooks/${HOST}.git"
            export COMPOSER_AUTH="{\"github-oauth\": {\"github.com\": \"$GH_TOKEN\"}}"
          else
            CLONE_URL="https://github.com/pressbooks/${HOST}.git"
          fi
          if ! git clone --depth=1 --single-branch "$CLONE_URL" "../${HOST}"; then
            echo "::error::Failed to clone pressbooks/${HOST}. If the repo is private, PAT_FOR_GITHUB_ACTIONS is required (fork PRs do not have access to secrets)."
            exit 1
          fi
          # Host plugins must be installed --no-dev: a dev install ships its own
          # PHPUnit tree, which would shadow the plugin-under-test's PHPUnit when
          # the host's autoloader is registered.
          cd "../${HOST}" && composer install --no-dev --prefer-dist

      - name: Require Private Repo
        if: inputs.requires_private_repo != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_GITHUB_ACTIONS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PAT_FOR_GITHUB_ACTIONS secret is required to clone private repo '${{ inputs.requires_private_repo }}' but is not available (fork PRs do not have access to secrets)"
            exit 1
          fi
          git clone --depth=1 --single-branch https://x-access-token:${GH_TOKEN}@github.com/pressbooks/${{ inputs.requires_private_repo }}.git ../${{ inputs.requires_private_repo }}
          cd ../${{ inputs.requires_private_repo }} && composer install --no-dev --prefer-dist
          cd ../$REPO_NAME

      - name: Install WP tests
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.config.wordpress }}

      - name: Run PHP Tests
        if: matrix.config.experimental == true
        env:
          X_PB_CI_TOKEN: ${{ secrets.X_PB_CI_TOKEN }}
          PB_TEST_HOST: ${{ matrix.host }}
        run: composer test

      - name: Run PHP Tests and PCOV
        if: matrix.config.experimental == false && inputs.code_coverage == true
        env:
          X_PB_CI_TOKEN: ${{ secrets.X_PB_CI_TOKEN }}
          PB_TEST_HOST: ${{ matrix.host }}
        run: composer test-coverage

      - name: Upload Coverage to Codecov
        if: matrix.config.experimental == false && inputs.code_coverage == true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_SECRET }}
